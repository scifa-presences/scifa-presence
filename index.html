<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Gestion effectifs &amp; présences</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF2FA; --surface:#FFFFFF; --ink:#0F1B33; --muted:#51607A; --line:#D3DCEC;
  --brand:#1346B8; --on-brand:#FFFFFF; --hdr:#0B2A6F; --accent:#D32030;
  --p:#1F5FD6; --aj:#B45309; --anj:#C81E2E; --nc:#6B7A93; --on:#FFFFFF;
  --head:'Familjen Grotesk','Public Sans',system-ui,sans-serif;
  --body:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A111F; --surface:#131C30; --ink:#E8EEFB; --muted:#9AA9C6; --line:#25324D;
    --brand:#7FA2FF; --on-brand:#08122B; --hdr:#0A1A44; --accent:#FF6B77;
    --p:#6EA0FF; --aj:#F0B45A; --anj:#FF7A85; --nc:#7E8DA8; --on:#08122B;
  }
}
:root[data-theme="dark"]{
  --bg:#0A111F; --surface:#131C30; --ink:#E8EEFB; --muted:#9AA9C6; --line:#25324D;
  --brand:#7FA2FF; --on-brand:#08122B; --hdr:#0A1A44; --accent:#FF6B77;
  --p:#6EA0FF; --aj:#F0B45A; --anj:#FF7A85; --nc:#7E8DA8; --on:#08122B;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--head);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:16px}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand h1{font-size:20px;font-weight:700;line-height:1.15}
.brand small{color:var(--muted);font-size:12.5px}
.top-r{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

.btn{min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.danger{color:var(--anj);border-color:var(--anj)}
.btn.small{min-height:34px;padding:0 10px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{color:var(--brand);font-weight:600;text-decoration:underline}

.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{width:100%;min-height:42px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
textarea{min-height:120px;resize:vertical}
.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.row .field{margin-bottom:0}
.grow{flex:1}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 16px;overflow-x:auto}
.tab{padding:11px 14px;border:0;background:none;color:var(--muted);font-weight:600;font-size:14.5px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.card h2{font-size:17px;font-weight:600;margin-bottom:10px}
.card p{margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:13px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:16px}
.kpi{background:var(--surface);padding:14px 16px;box-shadow:inset 4px 0 0 var(--c,var(--line))}
.kpi b{display:block;font:700 28px/1.1 var(--head);font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}

.gauge{display:flex;height:10px;border-radius:5px;overflow:hidden;background:color-mix(in srgb,var(--nc) 28%,var(--surface));min-width:90px}
.gauge i{display:block;height:100%}
.g-p{background:var(--p)}.g-aj{background:var(--aj)}.g-anj{background:var(--anj)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.note{padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);margin-bottom:16px;font-size:14px}
.note.ok{border-color:var(--p);background:color-mix(in srgb,var(--p) 10%,var(--surface))}
.note.bad{border-color:var(--anj);background:color-mix(in srgb,var(--anj) 10%,var(--surface))}
.note.warn{border-color:var(--aj);background:color-mix(in srgb,var(--aj) 10%,var(--surface))}

.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-weight:600;font-size:12.5px;border:1px solid var(--line);white-space:nowrap}
.chip.ok{color:var(--p);border-color:var(--p);background:color-mix(in srgb,var(--p) 10%,var(--surface))}
.chip.warn{color:var(--aj);border-color:var(--aj);background:color-mix(in srgb,var(--aj) 10%,var(--surface))}
.chip.bad{color:var(--anj);border-color:var(--anj);background:color-mix(in srgb,var(--anj) 10%,var(--surface))}
.chip.idle{color:var(--muted)}

.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl .n{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.acts{display:flex;gap:6px;flex-wrap:wrap}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .search{flex:1;min-width:200px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;cursor:pointer}
.fbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.agents{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.agent{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--line);border-left:5px solid var(--nc)}
.agent:last-child{border-bottom:0}
.agent.s-P{border-left-color:var(--p)}.agent.s-AJ{border-left-color:var(--aj)}.agent.s-ANJ{border-left-color:var(--anj)}
.who b{display:block;font-weight:600}
.who span{font-size:13px;color:var(--muted)}
.seg{display:flex;gap:6px}
.opt{min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:600;font-size:13.5px;cursor:pointer}
.opt.on.p{background:var(--p);border-color:var(--p);color:var(--on)}
.opt.on.aj{background:var(--aj);border-color:var(--aj);color:var(--on)}
.opt.on.anj{background:var(--anj);border-color:var(--anj);color:var(--on)}
.opt[disabled]{cursor:not-allowed;opacity:.6}
.just{grid-column:1/-1;display:grid;grid-template-columns:200px 1fr;gap:8px}
.just .bad{border-color:var(--anj)}
.agent-edit{grid-template-columns:1fr auto}

.trend{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:150px;align-items:end}
.bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font-size:12px;color:var(--muted)}
.bar i{display:block;width:100%;max-width:46px;background:var(--brand);border-radius:4px 4px 0 0;min-height:2px}
.bar b{color:var(--ink);font-variant-numeric:tabular-nums}

.login{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login-card{width:min(460px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px}
.login-card h1{font-size:26px;line-height:1.15;margin-bottom:8px}
.lead{color:var(--muted);margin:0 0 18px}

#modal[hidden]{display:none}
.scrim{position:fixed;inset:0;background:rgba(8,14,18,.58);z-index:20}
.sheet{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;background:var(--surface);border-radius:12px;padding:20px;z-index:21;border:1px solid var(--line)}
.sheet h2{font-size:19px;margin-bottom:10px}
.sheet-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.code{font:700 26px/1 var(--head);letter-spacing:.12em;padding:10px 14px;border:1px dashed var(--muted);border-radius:8px;display:inline-block}

#toasts{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;z-index:30}
.toast{pointer-events:auto;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:14px;max-width:520px}
.toast.err{background:var(--anj);color:#fff}
.toast.ok{background:var(--p);color:var(--on)}


.banner{height:52px;display:flex;align-items:center;padding:0 16px 0 max(16px,calc((100% - 1120px)/2 + 16px));color:#fff;font:600 16px/1.2 var(--head);background:linear-gradient(90deg,var(--hdr) 0%,#1B4DB8 100%)}
.banner span::first-letter{text-transform:uppercase}
/* ── Habillage bleu et rouge ── */
.top{background:var(--hdr);color:#fff;border-bottom:4px solid var(--accent)}
.brand-wrap{display:flex;gap:12px;align-items:center}
.brand h1{color:#fff}
.brand small{color:#BCCDF3}
.top .chip{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.4)}
.top .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
.top .btn:hover{background:rgba(255,255,255,.12);border-color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger:hover{background:color-mix(in srgb,var(--anj) 10%,var(--surface))}
.tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--accent)}
.card{border-radius:12px;box-shadow:0 1px 3px rgba(11,42,111,.08)}
.kpis{border-radius:12px;box-shadow:0 1px 3px rgba(11,42,111,.08)}
.kpi b{color:var(--c,var(--ink))}
.tbl th{background:color-mix(in srgb,var(--brand) 7%,var(--surface))}
.fbtn[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.agents{box-shadow:0 1px 3px rgba(11,42,111,.08)}
.login{min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));background:linear-gradient(160deg,var(--hdr) 0%,#123C9C 100%)}
.login-card{border:0;border-top:6px solid var(--accent);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.28)}
.login-card h1{color:var(--brand)}
.sigle{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:6px;background:#D32030;color:#fff;font:700 12px/1.5 var(--body);letter-spacing:.05em;vertical-align:middle}
.svc{margin:0 0 6px;font-weight:600;color:var(--muted)}
.login-logo{margin-bottom:14px}
.sheet{border-top:5px solid var(--accent)}
.note.ok{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 9%,var(--surface))}
.chip.ok{color:var(--brand);border-color:var(--brand);background:color-mix(in srgb,var(--brand) 9%,var(--surface))}
.trend .bar i{background:linear-gradient(180deg,var(--brand),color-mix(in srgb,var(--brand) 70%,var(--hdr)))}
@media (max-width:640px){
  .agent{grid-template-columns:1fr}
  .seg{display:grid;grid-template-columns:repeat(3,1fr)}
  .opt{padding:0 6px;font-size:13px}
  .just{grid-template-columns:1fr}
  .brand h1{font-size:17px}
  .kpi b{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<body>
<div id="app"></div>
<div id="modal" hidden></div>
<div id="toasts" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function(){
'use strict';

const SUPABASE_URL = 'https://jvaitvkcpgslwhtsdumg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_cUksh8i83oIrbEFQk2Lnpw_fzg7tb2q';

/* ───────── Utilitaires ───────── */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr = () => ymd(new Date());
const fmtDate = s => { const [y,m,d] = String(s).split('-'); return `${d}/${m}/${y}`; };
const fmtShort = s => { const [,m,d] = String(s).split('-'); return `${d}/${m}`; };
const fmtLong = s => new Date(s+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const fmtTime = ms => ms ? new Date(ms).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}) : '';
const pct = (a,b) => b > 0 ? Math.round(a*1000/b)/10 : null;
const fmtPct = v => v == null ? '—' : String(v).replace('.',',') + ' %';
const digits = s => String(s || '').replace(/\D/g,'');
const phoneKey = s => digits(s).slice(-9);
const chiefEmail = p => `c${phoneKey(p)}@scifa-presences.local`;
const clone = o => JSON.parse(JSON.stringify(o));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return ymd(d); };
const ST = { P:'Présent', AJ:'Absence justifiée', ANJ:'Absence non justifiée' };
const MOTIFS = ['Maladie','Congé','Mission','Deuil','Formation','Autre'];

function genCode(){
  try{ const a = new Uint32Array(1); crypto.getRandomValues(a); return String(10000000 + (a[0] % 90000000)); }
  catch(_){ return String(Math.floor(10000000 + Math.random()*90000000)); }
}
const dbMsg = e => {
  const m = (e && e.message) || '';
  if(/row-level security|permission denied/i.test(m)) return 'Accès refusé : vos droits ne permettent pas cette action.';
  if(e && e.code === '23505') return 'Cette valeur existe déjà.';
  if(e && (e.code === '42P01' || /relation .* does not exist|schema cache/i.test(m))) return 'La base n’est pas configurée : exécutez le fichier supabase-setup.sql.';
  if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Pas de connexion internet. Réessayez.';
  return m || 'Une erreur est survenue. Réessayez.';
};

/* ───────── État ───────── */
const S = {
  ready:false, error:'', sb:null, me:null, isAdmin:false, canWrite:true,
  org:{name:''}, depts:[], agents:{}, dayReports:{}, dayInit:false, history:[],
  session:null, tab:'', date:todayStr(), f:{}, modal:null, modalErr:'',
  trend:null, trendFor:'', ch:null, poll:null
};
const C = {};
function resetC(){ Object.assign(C,{entries:{},status:'draft',sentAt:null,dirty:false,saving:false,loaded:false,filter:'all',err:''}); }
resetC();
const curDept = () => S.session && S.session.deptId ? S.depts.find(d => d.id === S.session.deptId) : null;
const deptAgents = id => S.agents[id] || [];
function tally(entries, ag){
  let p=0, aj=0, anj=0;
  for(const a of ag){ const e = entries[a.id]; if(!e) continue; if(e.s==='P') p++; else if(e.s==='AJ') aj++; else if(e.s==='ANJ') anj++; }
  return { eff:ag.length, p, aj, anj, nc:ag.length-p-aj-anj };
}
const onErr = e => { console.error(e); toast(dbMsg(e),'err'); };

/* ───────── Chargement des données ───────── */
async function fetchAll(make){
  const out = [];
  for(let from = 0; ; from += 1000){
    const { data, error } = await make(from, from + 999);
    if(error) throw error;
    out.push(...data);
    if(data.length < 1000) break;
  }
  return out;
}
function repDoc(r){
  const d = S.depts.find(x => x.id === r.dept_id);
  return { deptId:r.dept_id, deptName: d ? d.name : '', date:r.date, status:r.status, entries:r.entries || {}, c:r.c || null,
    totals:r.totals || null, absents:r.absents || [], sentAt: r.sent_at ? Date.parse(r.sent_at) : null,
    chief:{ name:r.chief_name || '', phone:r.chief_phone || '' } };
}
async function loadOrg(){
  const { data, error } = await S.sb.from('settings').select('org_name').eq('id',1).maybeSingle();
  if(error) throw error;
  S.org = { name: data ? data.org_name : '' }; render();
}
async function loadDepts(){
  const { data, error } = await S.sb.from('departments').select('id,name,chief_name,phone');
  if(error) throw error;
  S.depts = data.map(d => ({ id:d.id, name:d.name, chief:d.chief_name, phone:d.phone })).sort((a,b) => String(a.name).localeCompare(b.name,'fr'));
  render();
}
async function loadAgents(){
  const rows = await fetchAll((a,b) => S.sb.from('agents').select('id,dept_id,name,matricule,grade').order('name').order('id').range(a,b));
  const m = {};
  rows.forEach(r => { (m[r.dept_id] = m[r.dept_id] || []).push({ id:r.id, name:r.name, matricule:r.matricule || '', grade:r.grade || '' }); });
  S.agents = m; render();
}
async function loadDay(){
  const date = S.date;
  const { data, error } = await S.sb.from('reports').select('*').eq('date', date);
  if(error) throw error;
  if(date !== S.date) return;
  const prev = S.dayReports, next = {};
  data.forEach(r => { next[r.dept_id] = repDoc(r); });
  if(S.dayInit){
    Object.values(next).forEach(n => {
      const o = prev[n.deptId];
      if(n.status === 'sent' && (!o || o.status !== 'sent') && Date.now() - (n.sentAt || 0) < 120000)
        toast(`${n.deptName} vient d’envoyer son rapport (${fmtTime(n.sentAt)}).`,'ok');
    });
  }
  S.dayReports = next; S.dayInit = true; render();
}
async function loadReport(){
  const date = S.date, id = S.session.deptId;
  const { data, error } = await S.sb.from('reports').select('*').eq('dept_id', id).eq('date', date).maybeSingle();
  if(error) throw error;
  if(date !== S.date) return;
  if(!C.dirty && !C.saving){
    if(data){ const d = repDoc(data); C.entries = clone(d.entries); C.status = d.status; C.sentAt = d.sentAt; }
    else { C.entries = {}; C.status = 'draft'; C.sentAt = null; }
  }
  C.loaded = true; render();
}
async function loadHistory(){
  const id = S.session.deptId;
  const { data, error } = await S.sb.from('reports').select('date,sent_at,totals').eq('dept_id', id).eq('status','sent').order('date',{ascending:false}).limit(60);
  if(error) throw error;
  S.history = data.map(h => { const t = h.totals || {}; return { date:h.date, sentAt: h.sent_at ? Date.parse(h.sent_at) : null, eff:t.eff||0, p:t.p||0, aj:t.aj||0, anj:t.anj||0 }; });
  render();
}
async function loadTrend(){
  const key = S.date; S.trendFor = key;
  const days = [];
  for(let i = 6; i >= 0; i--){ const dt = new Date(key+'T12:00:00'); dt.setDate(dt.getDate() - i); days.push(ymd(dt)); }
  const { data, error } = await S.sb.from('reports').select('date,totals').eq('status','sent').gte('date', days[0]).lte('date', days[6]);
  if(error) throw error;
  const agg = {};
  days.forEach(d => { agg[d] = { d, eff:0, p:0, sent:0 }; });
  data.forEach(r => { if(r.totals && agg[r.date]){ agg[r.date].eff += r.totals.eff; agg[r.date].p += r.totals.p; agg[r.date].sent++; } });
  if(S.trendFor === key){ S.trend = days.map(d => agg[d]); render(); }
}
const timers = {};
function refreshSoon(kind){ clearTimeout(timers[kind]); timers[kind] = setTimeout(() => refresh(kind).catch(console.error), 300); }
async function refresh(kind){
  if(!S.session) return;
  if(kind === 'org') return loadOrg();
  if(kind === 'depts') return loadDepts();
  if(kind === 'agents') return loadAgents();
  if(kind === 'day') return S.session.role === 'admin' ? loadDay() : loadReport();
}
function startRealtime(){
  stopRealtime();
  try{
    S.ch = S.sb.channel('scifa')
      .on('postgres_changes',{event:'*',schema:'public',table:'reports'}, () => refreshSoon('day'))
      .on('postgres_changes',{event:'*',schema:'public',table:'agents'}, () => refreshSoon('agents'))
      .on('postgres_changes',{event:'*',schema:'public',table:'departments'}, () => refreshSoon('depts'))
      .on('postgres_changes',{event:'*',schema:'public',table:'settings'}, () => refreshSoon('org'))
      .subscribe();
  }catch(e){ console.error(e); }
  S.poll = setInterval(() => { if(!document.hidden) refreshSoon('day'); }, 30000);
}
function stopRealtime(){
  if(S.ch){ try{ S.sb.removeChannel(S.ch); }catch(_){} S.ch = null; }
  if(S.poll){ clearInterval(S.poll); S.poll = null; }
}
function onDateChange(){
  if(!S.session) return;
  if(S.session.role === 'chief'){
    C.loaded = false; C.entries = {}; C.status = 'draft'; C.sentAt = null; C.dirty = false; C.err = '';
    loadReport().catch(onErr); loadHistory().catch(onErr);
  }else{
    S.dayReports = {}; S.dayInit = false;
    loadDay().catch(onErr); loadTrend().catch(onErr);
  }
}

let rq = false;
function render(){ if(rq) return; rq = true; requestAnimationFrame(() => { rq = false; doRender(); }); }
function doRender(){
  const ae = document.activeElement;
  const fid = ae && ae.id;
  let ss = null, se = null;
  try{ ss = ae.selectionStart; se = ae.selectionEnd; }catch(_){}
  $('#app').innerHTML = view();
  if(fid){
    const el = document.getElementById(fid);
    if(el && el !== document.activeElement){
      el.focus({preventScroll:true});
      try{ if(ss != null) el.setSelectionRange(ss, se); }catch(_){}
    }
  }
}
function view(){
  if(S.error === 'nolib') return `<div class="login"><div class="login-card"><h1>Chargement impossible</h1><p class="lead">La bibliothèque de connexion n’a pas pu se charger. Vérifiez la connexion internet puis rechargez la page.</p></div></div>`;
  if(!S.ready) return `<div class="login"><div class="login-card"><p class="lead">Chargement…</p></div></div>`;
  if(!S.session) return loginView();
  return S.session.role === 'admin' ? shell(adminView()) : shell(chiefView());
}

const logo = n => `<img src="${LOGO_SRC}" width="${n}" height="${n}" alt="Logo SCIFA" style="object-fit:contain;border-radius:50%">`;
function shell(inner){
  const admin = S.session.role === 'admin';
  const d = admin ? null : curDept();
  return `<header class="top"><div class="brand-wrap">${logo(46)}<div class="brand"><h1>Gestion effectifs &amp; présences<span class="sigle">SCIFA</span></h1><small>Service de Communication et d’Information${S.org.name ? ' · ' + esc(S.org.name) : ''}</small></div></div>
  <div class="top-r"><span class="chip idle">${admin ? 'Administrateur général' : 'Chef · ' + esc(d ? d.name : '')}</span><button class="btn small" data-act="logout">Quitter</button></div></header>
  <div class="banner" role="img" aria-label="Bandeau"><span>${esc(fmtLong(todayStr()))}</span></div>
  <main class="wrap">${inner}</main>`;
}
const tabsHtml = (list, cur) => `<div class="tabs" role="tablist">${list.map(([k,l]) => `<button class="tab" role="tab" aria-selected="${k===cur}" data-act="tab" data-v="${k}">${l}</button>`).join('')}</div>`;
const kpis = items => `<div class="kpis">${items.map(([l,v,c]) => `<div class="kpi" style="--c:var(${c})"><b>${v}</b><span>${l}</span></div>`).join('')}</div>`;
function gauge(t, eff){
  if(!eff) return '<div class="gauge"></div>';
  const p = t ? t.p : 0, aj = t ? t.aj : 0, anj = t ? t.anj : 0;
  const w = n => (n/eff*100).toFixed(2);
  return `<div class="gauge" role="img" aria-label="${p} présents, ${aj} absences justifiées, ${anj} absences non justifiées sur ${eff}"><i class="g-p" style="width:${w(p)}%"></i><i class="g-aj" style="width:${w(aj)}%"></i><i class="g-anj" style="width:${w(anj)}%"></i></div>`;
}
const legend = () => `<div class="legend"><span><b style="background:var(--p)"></b>Présents</span><span><b style="background:var(--aj)"></b>Absences justifiées</span><span><b style="background:var(--anj)"></b>Absences non justifiées</span><span><b style="background:color-mix(in srgb,var(--nc) 28%,var(--surface))"></b>Non contrôlés</span></div>`;

/* ───────── Connexion ───────── */

async function enterApp(expect){
  const { data:{ session } } = await S.sb.auth.getSession();
  if(!session) return { ok:false };
  const uid = session.user.id;
  const [a, c] = await Promise.all([
    S.sb.from('admins').select('user_id').eq('user_id', uid).maybeSingle(),
    S.sb.from('chiefs').select('dept_id').eq('user_id', uid).maybeSingle()
  ]);
  if(a.error) throw a.error;
  if(c.error) throw c.error;
  let sess = null;
  if(a.data) sess = { role:'admin' };
  else if(c.data) sess = { role:'chief', deptId:c.data.dept_id };
  if(!sess || (expect && sess.role !== expect)){
    await S.sb.auth.signOut();
    return { ok:false, msg: !sess ? 'Ce compte n’a aucun accès à l’application. Contactez l’administrateur.' : expect === 'admin' ? 'Ce compte n’est pas administrateur.' : 'Ce compte n’est pas un chef de département.' };
  }
  S.me = session.user; S.isAdmin = sess.role === 'admin'; S.session = sess;
  S.tab = sess.role === 'admin' ? 'dash' : 'saisie'; S.f.q = ''; resetC();
  await loadDepts();
  await Promise.all([loadOrg(), loadAgents()]);
  startRealtime(); onDateChange(); render();
  return { ok:true };
}
async function doLogin(mode){
  const now = Date.now();
  if(S.f.lock && now < S.f.lock){ S.f.err = 'Trop d’essais. Réessayez dans quelques secondes.'; render(); return; }
  let email, password;
  if(mode === 'chief'){
    const code = (S.f.code || '').trim();
    if(phoneKey(S.f.phone).length < 9 || code.length < 6){ S.f.err = 'Saisissez votre numéro de téléphone et votre code d’accès.'; render(); return; }
    email = chiefEmail(S.f.phone); password = code;
  }else{
    email = (S.f.aemail || '').trim(); password = S.f.apass || '';
    if(!email || !password){ S.f.err = 'Saisissez votre adresse e-mail et votre mot de passe.'; render(); return; }
  }
  S.f.busy = true; S.f.err = ''; render();
  try{
    const { error } = await S.sb.auth.signInWithPassword({ email, password });
    if(error){
      S.f.fails = (S.f.fails || 0) + 1;
      if(S.f.fails >= 5){ S.f.lock = Date.now() + 30000; S.f.fails = 0; }
      S.f.err = mode === 'chief' ? 'Numéro de téléphone ou code incorrect.' : 'Adresse e-mail ou mot de passe incorrect.';
    }else{
      const r = await enterApp(mode);
      if(r.ok){ S.f.code = ''; S.f.apass = ''; S.f.fails = 0; } else S.f.err = r.msg || 'Connexion impossible.';
    }
  }catch(e){ S.f.err = dbMsg(e); }
  S.f.busy = false; render();
}
function resetSession(){
  stopRealtime();
  S.session = null; S.isAdmin = false; S.me = null; resetC();
  S.depts = []; S.agents = {}; S.dayReports = {}; S.history = []; S.trend = null; S.modal = null;
  renderModal(); render();
}
async function logout(){ try{ await S.sb.auth.signOut(); }catch(_){} resetSession(); }

function filtered(ag){
  const q = (S.f.q || '').trim().toLowerCase();
  return ag.filter(a => {
    const e = C.entries[a.id], st = e ? e.s : 'NC';
    if(C.filter === 'nc' && st !== 'NC') return false;
    if(['P','AJ','ANJ'].includes(C.filter) && st !== C.filter) return false;
    if(q && !`${a.name} ${a.matricule||''} ${a.grade||''}`.toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b) => a.name.localeCompare(b.name,'fr'));
}

function mark(id, s){
  if(C.status === 'sent') return;
  const cur = C.entries[id];
  if(cur && cur.s === s) delete C.entries[id];
  else C.entries[id] = { s, motif: s==='AJ' && cur ? cur.motif||'' : '', just: s==='AJ' && cur ? cur.just||'' : '' };
  touch(true);
}
let saveT = null;
function touch(doRender){
  C.dirty = true; C.err = '';
  if(doRender) render();
  clearTimeout(saveT); saveT = setTimeout(flush, 700);
}
async function flush(){
  if(C.saving){ saveT = setTimeout(flush, 400); return; }
  if(!C.dirty || !S.session || S.session.role !== 'chief') return;
  const dept = curDept(); if(!dept) return;
  C.saving = true; C.dirty = false; render();
  const date = S.date, ag = deptAgents(dept.id);
  try{
    const { error } = await S.sb.from('reports').upsert({ dept_id:dept.id, date, status:'draft', entries:clone(C.entries), c:tally(C.entries, ag), updated_at:new Date().toISOString() }, { onConflict:'dept_id,date' });
    if(error) throw error;
    C.err = '';
  }catch(e){ C.err = dbMsg(e); C.dirty = true; }
  C.saving = false; render();
  if(C.dirty && !C.err) saveT = setTimeout(flush, 100);
}
async function settle(){
  clearTimeout(saveT);
  for(let i = 0; i < 25 && (C.dirty || C.saving); i++){
    if(!C.saving) await flush(); else await sleep(150);
    if(C.err) break;
  }
}
async function sendReport(){
  const dept = curDept(); if(!dept) return;
  closeModal(); await settle();
  if(C.err){ toast('Le brouillon n’est pas enregistré : ' + C.err,'err'); return; }
  const ag = deptAgents(dept.id), t = tally(C.entries, ag), now = new Date();
  const absents = ag.filter(a => C.entries[a.id] && C.entries[a.id].s !== 'P').map(a => { const e = C.entries[a.id]; return { id:a.id, n:a.name, m:a.matricule||'', g:a.grade||'', s:e.s, motif:e.motif||'', just:e.just||'' }; });
  C.saving = true; render();
  try{
    const { error } = await S.sb.from('reports').upsert({ dept_id:dept.id, date:S.date, status:'sent', entries:clone(C.entries), c:t, totals:{eff:t.eff,p:t.p,aj:t.aj,anj:t.anj}, absents, sent_at:now.toISOString(), chief_name:dept.chief, chief_phone:dept.phone, updated_at:now.toISOString() }, { onConflict:'dept_id,date' });
    if(error) throw error;
    C.status = 'sent'; C.sentAt = now.getTime();
    toast('Rapport envoyé à l’administrateur général.','ok');
  }catch(e){ toast(dbMsg(e),'err'); }
  C.saving = false; render();
}
function askSend(){
  const dept = curDept(), ag = deptAgents(dept.id), t = tally(C.entries, ag);
  if(t.nc > 0){ toast(`${t.nc} agent(s) non contrôlé(s) : contrôlez tout l’effectif avant d’envoyer.`,'err'); C.filter = 'nc'; render(); return; }
  const bad = ag.filter(a => { const e = C.entries[a.id]; return e && e.s === 'AJ' && (!e.motif || !(e.just||'').trim()); }).length;
  if(bad > 0){ toast(`${bad} absence(s) justifiée(s) sans motif ou sans justificatif.`,'err'); C.filter = 'AJ'; render(); return; }
  openModal({ type:'confirm', title:'Envoyer le rapport ?', body:`Rapport du ${fmtDate(S.date)} : ${t.p} présents, ${t.aj} absences justifiées, ${t.anj} absences non justifiées sur ${t.eff} agents. Une fois envoyé, le rapport est verrouillé.`, ok:'Envoyer le rapport', act:'confirm-send' });
}

function searchView(deptId){
  const admin = !deptId;
  const q = (S.f.sq || '').trim().toLowerCase();
  const pool = [];
  (admin ? S.depts : S.depts.filter(d => d.id === deptId)).forEach(d => deptAgents(d.id).forEach(a => pool.push({ a, d })));
  const res = q.length >= 2
    ? pool.filter(x => `${x.a.name} ${x.a.matricule||''} ${x.a.grade||''} ${x.d.name}`.toLowerCase().includes(q)).sort((x,y) => x.a.name.localeCompare(y.a.name,'fr'))
    : [];
  const shown = res.slice(0, 50);
  const entryOf = x => admin ? ((S.dayReports[x.d.id] || {}).entries || {})[x.a.id] : C.entries[x.a.id];
  const chip = e => !e ? '<span class="chip idle">Non contrôlé</span>' : e.s === 'P' ? '<span class="chip ok">Présent</span>' : e.s === 'AJ' ? '<span class="chip warn">Absence justifiée</span>' : '<span class="chip bad">Absence non justifiée</span>';
  let depRes = '';
  if(admin && q.length >= 2){
    const rows = adminRows().filter(r => r.d.name.toLowerCase().includes(q) || String(r.d.chief).toLowerCase().includes(q));
    if(rows.length) depRes = `<div class="card scroll"><h2>Départements (${rows.length})</h2><table class="tbl"><tbody>${rows.map(r => `<tr><td><b>${esc(r.d.name)}</b><br><span class="muted small">${esc(r.d.chief)} · ${esc(r.d.phone)}</span></td><td class="n">${r.eff} agents</td><td>${statChip(r)}</td><td>${r.st === 'sent' ? `<button class="btn small" data-act="detail" data-d="${esc(r.d.id)}">Détail</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`;
  }
  let out;
  if(q.length < 2) out = `<div class="card"><p class="muted">Tapez au moins 2 lettres : un nom, un matricule, une fonction${admin ? ' ou un département' : ''}.</p></div>`;
  else if(!res.length && !depRes) out = `<div class="card"><p class="muted">Aucun résultat pour « ${esc(S.f.sq)} ».</p></div>`;
  else out = depRes + (res.length ? `<div class="card scroll"><h2>Agents (${res.length})</h2><p class="muted small">Situation du ${fmtDate(S.date)}${admin ? ' (rapports reçus ou en cours)' : ''}.</p><table class="tbl"><thead><tr><th>Agent</th>${admin ? '<th>Département</th>' : ''}<th>Situation</th><th></th></tr></thead><tbody>
    ${shown.map(x => `<tr><td><b>${esc(x.a.name)}</b><br><span class="muted small">${esc([x.a.matricule, x.a.grade].filter(Boolean).join(' · '))}</span></td>${admin ? `<td>${esc(x.d.name)}</td>` : ''}<td>${chip(entryOf(x))}</td><td><button class="btn small" data-act="agent-open" data-dept="${esc(x.d.id)}" data-id="${esc(x.a.id)}">Voir la situation</button></td></tr>`).join('')}</tbody></table>
    ${res.length > shown.length ? `<p class="muted small">Affichage des ${shown.length} premiers résultats sur ${res.length}. Précisez la recherche.</p>` : ''}</div>` : '');
  return `<div class="toolbar"><input class="search" id="sq" type="search" placeholder="${admin ? 'Rechercher un agent ou un département' : 'Rechercher un agent de mon département'}" aria-label="Recherche" data-bind="sq" data-live="1" value="${esc(S.f.sq||'')}"></div>${out}`;
}
async function openAgent(deptId, agentId){
  if(S.session && S.session.role === 'chief' && deptId !== S.session.deptId) return;
  const d = S.depts.find(x => x.id === deptId), a = deptAgents(deptId).find(x => x.id === agentId);
  if(!d || !a) return;
  const m = { type:'agent', a, d, loading:true, rows:[] };
  openModal(m);
  try{
    const { data, error } = await S.sb.from('reports').select('date,entries').eq('dept_id', deptId).eq('status','sent').gte('date', daysAgo(29)).order('date',{ascending:false});
    if(error) throw error;
    if(S.modal !== m) return;
    m.rows = data.map(r => { const e = (r.entries || {})[agentId]; return { date:r.date, s: e ? e.s : null, motif: e && e.motif || '', just: e && e.just || '' }; });
  }catch(e){ if(S.modal !== m) return; toast(dbMsg(e),'err'); }
  m.loading = false; renderModal();
}

async function addAgent(deptId){
  const name = (S.f.an || '').trim();
  if(!name){ toast('Saisissez le nom de l’agent.','err'); return; }
  try{
    const { data, error } = await S.sb.from('agents').insert({ dept_id:deptId, name, matricule:(S.f.am||'').trim(), grade:(S.f.agr||'').trim() }).select('id,name,matricule,grade').single();
    if(error) throw error;
    S.agents[deptId] = deptAgents(deptId).concat([{ id:data.id, name:data.name, matricule:data.matricule||'', grade:data.grade||'' }]);
    S.f.an = S.f.am = S.f.agr = '';
    toast('Agent ajouté.','ok'); render();
  }catch(e){ onErr(e); }
}
async function importAgents(deptId){
  const lines = String(S.f.imp || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const seen = new Set(deptAgents(deptId).map(a => (a.matricule ? 'm:'+a.matricule.toLowerCase() : 'n:'+a.name.toLowerCase())));
  const rows = []; let skipped = 0;
  lines.forEach((l, i) => {
    const p = l.split(/[;\t,]/).map(x => x.trim());
    if(i === 0 && /^(nom|name)/i.test(p[0])) return;
    if(!p[0]){ skipped++; return; }
    const key = p[1] ? 'm:'+p[1].toLowerCase() : 'n:'+p[0].toLowerCase();
    if(seen.has(key)){ skipped++; return; }
    seen.add(key);
    rows.push({ dept_id:deptId, name:p[0], matricule:p[1]||'', grade:p[2]||'' });
  });
  if(!rows.length){ toast('Aucun agent à importer (lignes vides ou doublons).','err'); return; }
  try{
    for(let i = 0; i < rows.length; i += 500){
      const { error } = await S.sb.from('agents').insert(rows.slice(i, i + 500));
      if(error) throw error;
    }
    S.f.imp = ''; S.f.impOpen = false;
    await loadAgents();
    toast(`${rows.length} agent(s) importé(s)${skipped ? `, ${skipped} ignoré(s)` : ''}.`,'ok');
  }catch(e){ onErr(e); loadAgents().catch(console.error); }
}
async function delAgent(deptId, id){
  try{
    const { error } = await S.sb.from('agents').delete().eq('id', id);
    if(error) throw error;
    S.agents[deptId] = deptAgents(deptId).filter(x => x.id !== id);
    toast('Agent retiré.','ok'); render();
  }catch(e){ onErr(e); }
}

function statChip(r){

  if(r.st === 'draft'){ const nc = r.t ? r.t.nc : r.eff; return `<span class="chip warn">En cours ${r.eff - nc}/${r.eff}</span>`; }

}
function waLink(d, text){

function relanceAll(rows){ return `Rappel : rapport de présence du ${fmtDate(S.date)} non reçu pour :\n${rows.map(r => `- ${r.d.name} (${r.d.chief})`).join('\n')}\nMerci de les transmettre dès que possible.`; }

function dash(){
  const rows = adminRows();
  const bar = `<div class="row" style="margin-bottom:16px"><div class="field"><label for="dt">Date</label><input id="dt" type="date" max="${todayStr()}" value="${S.date}" data-date="1"></div>
    <button class="btn" data-act="date-today">Aujourd’hui</button><div class="grow muted">${esc(fmtLong(S.date))}</div>
    <button class="btn" data-act="export-sum" ${rows.length?'':'disabled'}>Exporter le résumé (CSV)</button><button class="btn" data-act="export-det" ${rows.length?'':'disabled'}>Exporter les absences (CSV)</button></div>`;
  if(!rows.length) return bar + `<div class="card"><h2>Aucun département</h2><p class="muted">Commencez par ajouter vos départements et leurs chefs dans l’onglet Départements.</p><button class="btn primary" data-act="tab" data-v="depts">Configurer les départements</button></div>`;
  let effTotal = 0, P = 0, AJ = 0, ANJ = 0, effSent = 0, ncTotal = 0, missing = 0;
  rows.forEach(r => {
    effTotal += r.eff;
    if(r.st === 'sent'){ P += r.t.p; AJ += r.t.aj; ANJ += r.t.anj; effSent += r.t.eff; ncTotal += r.eff - (r.t.p + r.t.aj + r.t.anj); }
    else { ncTotal += r.eff; missing++; }
  });
  const pending = rows.filter(r => r.st !== 'sent');
  const relance = pending.length ? `<div class="card"><h2>Rapports non reçus (${pending.length})</h2><div class="scroll"><table class="tbl"><tbody>${pending.map(r => `<tr><td><b>${esc(r.d.name)}</b><br><span class="muted small">${esc(r.d.chief)} · ${esc(r.d.phone)}</span></td><td>${statChip(r)}</td><td><div class="acts"><a class="btn small" href="tel:+243${phoneKey(r.d.phone)}">Appeler</a><a class="btn small" href="${waLink(r.d, relanceOne(r))}" target="_blank" rel="noopener">WhatsApp</a></div></td></tr>`).join('')}</tbody></table></div>
    <div class="acts" style="margin-top:10px"><button class="btn" data-act="copy-relance">Copier le message de relance</button></div></div>` : `<div class="note ok">Tous les départements ont transmis leur rapport pour le ${fmtDate(S.date)}.</div>`;
  const table = `<div class="card scroll"><h2>Situation par département</h2><table class="tbl"><thead><tr><th>Département</th><th class="n">Effectif</th><th class="n">Présents</th><th class="n">Justifiées</th><th class="n">Non justif.</th><th class="n">Non contrôlés</th><th class="n">Présence</th><th style="min-width:130px">Répartition</th><th>Statut</th><th></th></tr></thead><tbody>
  ${rows.map(r => { const s = r.st === 'sent'; const t = r.t;
    return `<tr><td><b>${esc(r.d.name)}</b><br><span class="muted small">${esc(r.d.chief)}</span></td><td class="n">${r.eff}</td>
    <td class="n">${s ? t.p : '—'}</td><td class="n">${s ? t.aj : '—'}</td><td class="n">${s ? t.anj : '—'}</td><td class="n">${s ? r.eff - (t.p+t.aj+t.anj) : r.eff}</td>
    <td class="n">${s ? fmtPct(pct(t.p, t.eff)) : '—'}</td><td>${gauge(t, r.eff)}</td><td>${statChip(r)}</td>
    <td>${s ? `<button class="btn small" data-act="detail" data-d="${esc(r.d.id)}">Détail</button>` : ''}</td></tr>`; }).join('')}</tbody></table>${legend()}</div>`;
  let trend = '';
  if(S.trend){
    const tr = S.trend.map((x, i) => i === S.trend.length - 1 ? { d:x.d, eff:effSent, p:P, sent:rows.length - missing } : x);
    trend = `<div class="card"><div class="toolbar"><h2 class="grow" style="margin:0">Taux de présence sur 7 jours</h2><button class="btn small" data-act="trend-refresh">Actualiser</button></div>
    <div class="trend">${tr.map(x => { const v = pct(x.p, x.eff); return `<div class="bar" title="${fmtDate(x.d)} : ${fmtPct(v)} (${x.sent} département(s) reçu(s))"><b>${v == null ? '—' : Math.round(v) + '%'}</b><i style="height:${v == null ? 0 : v}%"></i><span>${fmtShort(x.d)}</span></div>`; }).join('')}</div>
    <p class="muted small" style="margin:10px 0 0">Calculé sur les départements ayant transmis leur rapport.</p></div>`;
  }
  return `${bar}${kpis([['Effectif total',effTotal,'--brand'],['Présents',P,'--p'],['Absences justifiées',AJ,'--aj'],['Absences non justifiées',ANJ,'--anj'],['Non contrôlés',ncTotal,'--nc'],['Taux de présence',fmtPct(pct(P,effSent)),'--p'],['Taux d’absence',fmtPct(pct(AJ+ANJ,effSent)),'--anj'],['Départements sans rapport',missing,'--anj']])}
  <p class="muted small" style="margin:-6px 0 16px">Les taux portent sur les départements qui ont transmis leur rapport ; les agents des autres départements comptent comme non contrôlés.</p>
  ${relance}${table}${trend}`;
}

async function saveDept(){
  const name = (S.f.dn||'').trim(), chief = (S.f.dc||'').trim(), phone = (S.f.dp||'').trim();
  const id = S.modal.id;
  const fail = m => { S.modalErr = m; renderModal(); };
  if(!name || !chief || digits(phone).length < 9) return fail('Renseignez le nom du département, le nom du chef et un numéro de téléphone d’au moins 9 chiffres.');
  if(S.depts.some(d => d.id !== id && phoneKey(d.phone) === phoneKey(phone))) return fail('Ce numéro est déjà utilisé par un autre département.');
  try{
    if(id){
      const old = S.depts.find(x => x.id === id);
      const { error } = await S.sb.from('departments').update({ name, chief_name:chief, phone }).eq('id', id);
      if(error) throw error;
      if(old && phoneKey(old.phone) !== phoneKey(phone)){
        const r = await S.sb.rpc('admin_set_chief', { p_dept:id, p_phone:phone, p_password:null });
        if(r.error) throw r.error;
      }
      await loadDepts(); toast('Département modifié.','ok'); closeModal();
    }else{
      const ins = await S.sb.from('departments').insert({ name, chief_name:chief, phone }).select('id').single();
      if(ins.error) throw ins.error;
      const code = genCode();
      const r = await S.sb.rpc('admin_set_chief', { p_dept:ins.data.id, p_phone:phone, p_password:code });
      if(r.error){ await S.sb.from('departments').delete().eq('id', ins.data.id); throw r.error; }
      await loadDepts();
      openModal({ type:'code', items:[{ name, chief, phone, code }] });
    }
  }catch(e){ fail(dbMsg(e)); }
}
async function newCode(id){
  const d = S.depts.find(x => x.id === id); if(!d) return;
  try{
    const code = genCode();
    const r = await S.sb.rpc('admin_set_chief', { p_dept:id, p_phone:d.phone, p_password:code });
    if(r.error) throw r.error;

}

const csvRow = a => a.map(v => { v = String(v ?? ''); return /[;"\n\r]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; }).join(';');
function exportCsv(name, rows){
  const blob = new Blob(['\ufeff' + rows.map(csvRow).join('\r\n')], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast('Fichier téléchargé.','ok');
}

  });
  exportCsv(`presences_resume_${S.date}.csv`, rows);

  exportCsv(`presences_absences_${S.date}.csv`, rows);

/* ───────── Fenêtres modales et notifications ───────── */
function openModal(m){ S.modal = m; S.modalErr = ''; renderModal(); }
function closeModal(){ S.modal = null; S.modalErr = ''; renderModal(); }
function renderModal(){
  const el = $('#modal'), m = S.modal;
  if(!m){ el.hidden = true; el.innerHTML = ''; return; }
  let body = '';
  const cancel = `<button class="btn" data-act="close">Fermer</button>`;
  if(m.type === 'confirm'){
    body = `<h2>${esc(m.title)}</h2><p>${esc(m.body)}</p><div class="sheet-actions"><button class="btn" data-act="close">Annuler</button><button class="btn ${m.danger?'danger':'primary'}" data-act="${m.act}">${esc(m.ok)}</button></div>`;
  }else if(m.type === 'dept'){
    body = `<h2>${m.id ? 'Modifier le département' : 'Nouveau département'}</h2>
    <div class="field"><label for="dn">Nom du département</label><input id="dn" data-bind="dn" value="${esc(S.f.dn||'')}"></div>
    <div class="field"><label for="dc">Nom du chef</label><input id="dc" data-bind="dc" value="${esc(S.f.dc||'')}"></div>
    <div class="field"><label for="dp">Téléphone du chef (identifiant de connexion)</label><input id="dp" type="tel" inputmode="tel" placeholder="+243 8X XXX XXXX" data-bind="dp" value="${esc(S.f.dp||'')}"></div>
    ${S.modalErr ? `<p class="note bad" role="alert">${esc(S.modalErr)}</p>` : ''}
    ${m.id ? '' : '<p class="muted small">Un code d’accès à 8 chiffres sera généré et affiché une seule fois.</p>'}
    <div class="sheet-actions"><button class="btn" data-act="close">Annuler</button><button class="btn primary" data-act="dept-save">Enregistrer</button></div>`;
  }else if(m.type === 'code'){
    body = `<h2>Code d’accès du chef</h2>
    <p class="note warn">Notez ce code maintenant : il ne sera plus affiché. Vous pourrez en générer un nouveau depuis l’onglet Départements.</p>
    ${m.items.map(i => `<p style="margin:10px 0 4px"><b>${esc(i.name)}</b> — ${esc(i.chief)}<br><span class="muted small">Téléphone : ${esc(i.phone)}</span></p><span class="code">${esc(i.code)}</span>`).join('')}
    <div class="sheet-actions"><button class="btn primary" data-act="close">J’ai noté le code</button></div>`;
  }else if(m.type === 'copy'){
    body = `<h2>Message de relance</h2><p class="muted small">Sélectionnez le texte puis copiez-le.</p><textarea id="cp" readonly>${esc(m.text)}</textarea><div class="sheet-actions">${cancel}</div>`;
  }else if(m.type === 'detail'){
    const r = m.rep, t = r.totals || r.c || { eff:0, p:0, aj:0, anj:0 }, abs = r.absents || [];
    const grp = s => abs.filter(a => a.s === s);
    const tbl = (s, title) => grp(s).length ? `<h3 style="font-size:15px;margin:14px 0 6px">${title} (${grp(s).length})</h3><div class="scroll"><table class="tbl"><thead><tr><th>Agent</th><th>Matricule</th>${s==='AJ'?'<th>Motif</th><th>Justificatif</th>':''}</tr></thead><tbody>${grp(s).map(a => `<tr><td>${esc(a.n)}</td><td>${esc(a.m)}</td>${s==='AJ'?`<td>${esc(a.motif)}</td><td>${esc(a.just)}</td>`:''}</tr>`).join('')}</tbody></table></div>` : '';
    body = `<h2>${esc(r.deptName)} · ${fmtDate(r.date)}</h2>
    <p class="muted small">Validé par ${esc(r.chief ? r.chief.name : '')}${r.sentAt ? ' le ' + fmtDate(r.date) + ' à ' + fmtTime(r.sentAt) : ''}</p>
    ${kpis([['Effectif',t.eff,'--brand'],['Présents',t.p,'--p'],['Justifiées',t.aj,'--aj'],['Non justifiées',t.anj,'--anj'],['Présence',fmtPct(pct(t.p,t.eff)),'--p']])}
    ${abs.length ? tbl('AJ','Absences justifiées') + tbl('ANJ','Absences non justifiées') : '<p class="muted">Aucune absence : tous les agents étaient présents.</p>'}
    <div class="sheet-actions">${m.admin && r.status === 'sent' ? `<button class="btn danger" data-act="reopen" data-d="${esc(r.deptId)}" data-date="${esc(r.date)}">Rouvrir pour correction</button>` : ''}${cancel}</div>`;
  }
  if(m.type === 'agent'){
    const known = m.rows.filter(r => r.s);
    const cnt = s => known.filter(r => r.s === s).length;
    const chip = s => s === 'P' ? '<span class="chip ok">Présent</span>' : s === 'AJ' ? '<span class="chip warn">Absence justifiée</span>' : s === 'ANJ' ? '<span class="chip bad">Absence non justifiée</span>' : '<span class="chip idle">Non contrôlé</span>';
    body = `<h2>${esc(m.a.name)}</h2><p class="muted small">${esc([m.a.matricule, m.a.grade].filter(Boolean).join(' · '))}${m.a.matricule || m.a.grade ? ' · ' : ''}${esc(m.d.name)}</p>`;
    if(m.loading) body += `<p class="muted">Chargement des 30 derniers jours…</p>`;
    else if(!m.rows.length) body += `<p class="muted">Aucun rapport envoyé pour ce département sur les 30 derniers jours.</p>`;
    else body += `${kpis([['Jours contrôlés',known.length,'--brand'],['Présent',cnt('P'),'--p'],['Justifiées',cnt('AJ'),'--aj'],['Non justifiées',cnt('ANJ'),'--anj'],['Présence',fmtPct(pct(cnt('P'), known.length)),'--p']])}
      <div class="scroll"><table class="tbl"><thead><tr><th>Date</th><th>Situation</th><th>Motif</th><th>Justificatif</th></tr></thead><tbody>${m.rows.map(r => `<tr><td>${fmtDate(r.date)}</td><td>${chip(r.s)}</td><td>${esc(r.motif)}</td><td>${esc(r.just)}</td></tr>`).join('')}</tbody></table></div>
      <p class="muted small" style="margin-top:10px">30 derniers jours, rapports envoyés uniquement.</p>`;
    body += `<div class="sheet-actions">${cancel}</div>`;
  }
  el.hidden = false;
  el.innerHTML = `<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true">${body}</div>`;
  const f = el.querySelector('input,textarea,select');
  if(f && m.type !== 'detail' && m.type !== 'agent') f.focus();
}
function toast(msg, kind){
  const t = document.createElement('div');
  t.className = 'toast ' + (kind || ''); t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), kind === 'err' ? 6000 : 4000);
}

  const id = t.dataset.id, v = t.dataset.v;
  const role = S.session && S.session.role;
  const ADMIN_ONLY = ['date-today','detail','reopen','trend-refresh','copy-relance','export-sum','export-det','org-save','dept-new','dept-edit','dept-save','dept-code','dept-del','confirm-del-dept'];
  if(ADMIN_ONLY.includes(a) && !(role === 'admin' && S.isAdmin)) return;
  if(role === 'chief'){
    const mine = S.session.deptId;
    const dd = a === 'confirm-del-agent' ? (S.modal && S.modal.payload && S.modal.payload.dept) : t.dataset.dept;
    if(['add-agent','import-agents','del-agent','agent-open','confirm-del-agent'].includes(a) && dd !== mine) return;
    if(a === 'tab' && !['saisie','rech','hist','agents'].includes(v)) return;
  }
  if(role === 'admin' && a === 'tab' && !['dash','rech','depts','agents'].includes(v)) return;
  switch(a){
    case 'close': return closeModal();
    case 'login-mode': S.f.lm = v; S.f.err = ''; return render();
    case 'login-chief': return doLogin('chief');
    case 'login-admin': return doLogin('admin');
    case 'logout': return logout();
    case 'tab': S.tab = v; return render();
    case 'mark': return mark(id, t.dataset.s);
    case 'filter': C.filter = v; return render();
    case 'all-present':
      if(C.status === 'sent') return;
      deptAgents(S.session.deptId).forEach(x => { if(!C.entries[x.id]) C.entries[x.id] = { s:'P', motif:'', just:'' }; });
      return touch(true);
    case 'send': return askSend();
    case 'confirm-send': return sendReport();
    case 'retry-save': C.err = ''; C.dirty = true; return flush();
    case 'date-today': await switchDate(todayStr()); return;
    case 'hist-detail':
      try{
        const { data, error } = await S.sb.from('reports').select('*').eq('dept_id', S.session.deptId).eq('date', t.dataset.date).maybeSingle();
        if(error) throw error;
        if(data) showDetail(repDoc(data), false); else toast('Rapport introuvable.','err');
      }catch(e){ onErr(e); }
      return;
    case 'detail': { const r = S.dayReports[t.dataset.d]; if(r) showDetail(r, true); return; }
    case 'reopen': return reopen(t.dataset.d, t.dataset.date);
    case 'agent-open': return openAgent(t.dataset.dept, id);
    case 'trend-refresh': return loadTrend().catch(onErr);
    case 'copy-relance': return copyText(relanceAll(adminRows().filter(r => r.st !== 'sent')));
    case 'export-sum': return exportSummary();
    case 'export-det': return exportDetail();
    case 'org-save': return saveOrg();
    case 'dept-new': return openDept(null);
    case 'dept-edit': return openDept(id);
    case 'dept-save': return saveDept();
    case 'dept-code': return newCode(id);
    case 'dept-del': { const d = S.depts.find(x => x.id === id); if(!d) return; return openModal({ type:'confirm', title:'Supprimer ce département ?', body:`« ${d.name} », sa liste d’agents, ses rapports et le compte de son chef seront supprimés définitivement. Pensez à exporter les données avant.`, ok:'Supprimer', act:'confirm-del-dept', danger:true, payload:id }); }
    case 'confirm-del-dept': return delDept(S.modal.payload);
    case 'toggle-import': S.f.impOpen = !S.f.impOpen; return render();
    case 'add-agent': return addAgent(t.dataset.dept);
    case 'import-agents': return importAgents(t.dataset.dept);
    case 'del-agent': { const ag = deptAgents(t.dataset.dept).find(x => x.id === id); if(!ag) return; return openModal({ type:'confirm', title:'Retirer cet agent ?', body:`${ag.name} sera retiré de l’effectif normal. Les rapports déjà envoyés ne changent pas.`, ok:'Retirer', act:'confirm-del-agent', danger:true, payload:{ dept:t.dataset.dept, id } }); }
    case 'confirm-del-agent': { const p = S.modal.payload; closeModal(); return delAgent(p.dept, p.id); }
  }
}
async function switchDate(v){
  if(!v || v > todayStr()){ render(); return; }
  if(S.session && S.session.role === 'chief') await settle();
  S.date = v; onDateChange(); render();
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if(!t) return;
  if(t.dataset.act === 'close' && t.classList.contains('scrim') === false && t.tagName !== 'BUTTON') return;
  handle(t.dataset.act, t).catch(console.error);
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset.bind){ S.f[t.dataset.bind] = t.value; if(t.dataset.live) render(); }
  else if(t.dataset.just){
    const en = C.entries[t.dataset.just];
    if(en && en.s === 'AJ'){ en.just = t.value; t.classList.toggle('bad', !t.value.trim()); touch(false); }
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.date){ switchDate(t.value); }
  else if(t.dataset.motif){
    const en = C.entries[t.dataset.motif];
    if(en && en.s === 'AJ'){ en.motif = t.value; touch(true); }
  }
  else if(t.dataset.bind && t.tagName === 'SELECT'){ S.f[t.dataset.bind] = t.value; render(); }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && S.modal) closeModal();
  if(e.key === 'Enter' && !S.session){
    if(e.target.id === 'ph' || e.target.id === 'cd') doLogin('chief');
    else if(e.target.id === 'ae' || e.target.id === 'ap') doLogin('admin');
  }
});

/* ───────── Démarrage ───────── */
(async function boot(){
  render();
  if(!window.supabase || !window.supabase.createClient){ S.error = 'nolib'; S.ready = true; render(); return; }
  S.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  S.sb.auth.onAuthStateChange(ev => { if(ev === 'SIGNED_OUT' && S.session) setTimeout(resetSession, 0); });
  try{ await enterApp(); }catch(e){ console.error(e); }
  S.ready = true; render();
})();
})();

</script>
